plugins {
    id 'io.nextflow.nextflow-plugin' version "${nextflowPluginVersion}"
    id 'java-test-fixtures'
}

nextflowPlugin {
    nextflowVersion = '25.08.0-edge'

    provider = "${nextflowPluginProvider}"
    description = 'Apache Iceberg-based global cache for sharing cached task results across pipelines, users, and environments'
    className = 'nextflow.IcebergCachePlugin'
    useDefaultDependencies = false
    extensionPoints = [
        'nextflow.cache.iceberg.IcebergCacheFactory'
    ]
}

sourceSets {
    main.java.srcDirs = []
    main.groovy.srcDirs = ['src/main']
    main.resources.srcDirs = ['src/resources']
    test.groovy.srcDirs = ['src/test']
    test.java.srcDirs = []
    test.resources.srcDirs = []
}

configurations {
    runtimeClasspath.exclude group: 'org.slf4j', module: 'slf4j-api'
}

ext {
    icebergVersion = '1.7.1'
    hadoopVersion = '3.3.6'
}

dependencies {
    compileOnly project(':nextflow')
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    compileOnly 'org.pf4j:pf4j:3.12.0'

    // Apache Iceberg core
    implementation "org.apache.iceberg:iceberg-core:${icebergVersion}"
    implementation "org.apache.iceberg:iceberg-api:${icebergVersion}"
    implementation "org.apache.iceberg:iceberg-data:${icebergVersion}"
    implementation "org.apache.iceberg:iceberg-parquet:${icebergVersion}"

    // Iceberg catalog implementations
    implementation "org.apache.iceberg:iceberg-aws:${icebergVersion}"
    implementation "org.apache.iceberg:iceberg-gcp:${icebergVersion}"

    // Hadoop for filesystem access
    implementation "org.apache.hadoop:hadoop-common:${hadoopVersion}"
    implementation "org.apache.hadoop:hadoop-hdfs-client:${hadoopVersion}"
    implementation "org.apache.hadoop:hadoop-mapreduce-client-core:${hadoopVersion}"
    implementation "org.apache.hadoop:hadoop-aws:${hadoopVersion}"

    // Parquet for efficient storage
    implementation 'org.apache.parquet:parquet-avro:1.13.1'

    testImplementation(testFixtures(project(":nextflow")))
    testImplementation "org.apache.groovy:groovy:4.0.29"
    testImplementation "org.apache.groovy:groovy-nio:4.0.29"
}
